name: Build E-Vedhika UBD Deployment Tool

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Publish .NET Framework 4.8 App
      run: dotnet publish csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.csproj -c Release -o csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EVedhikaUBDDeploymentTool-Release
        path: csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/
