name: Build Executable

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # ఒకవేళ మీ ప్రాజెక్ట్‌కి requirements.txt ఉంటే ఈ కింద లైన్ అన్‌కమೆಂಟ್ చేయండి
        # if (-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build with PyInstaller
      run: |
        # E-VEDHIKA UBD TOOL బదులు మీ మెయిన్ పైథాన్ ఫైల్ పేరు ఇవ్వండి (ఉదాహరణకు E-VEDHIKA UBD TOOL)
        pyinstaller --onefile --noconsole E-VEDHIKA UBD TOOL

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UBDTOOLS-Exe
        path: dist/*.exe
