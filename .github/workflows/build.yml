name: Build CSharp Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln

    - name: Build Solution (Release)
      run: |
        msbuild csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Compile Full Bundled Installer with Inno Setup (Includes all Payload files)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool_Setup.iss

    - name: Create Release Link (Fixed URL)
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        files: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/*.exe
        name: Latest Stable Build
        body: "Automatic build from GitHub Actions. Contains full bundled single-file Installer (.exe) with all Payload software/drivers included."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EVedhika-UBD-Full-Bundle-Setup
        path: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/*.exe
