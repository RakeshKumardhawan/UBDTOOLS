name: Build CSharp Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln

    - name: Download Visual C++ Redistributable (x86) for Win7 Compatibility
      run: |
        curl -L -o csharp_solution/EVedhikaUBDDeploymentTool/installers/vc_redist.x86.exe https://aka.ms/vs/17/release/vc_redist.x86.exe

    - name: Build and Publish Executable
      run: |
        dotnet publish csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.csproj -c Release -o csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Compile Full Bundled Installer with Inno Setup (Includes all Payload files)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool_Setup.iss

    - name: Create Release Link (Fixed URL)
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        files: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
        name: Latest Stable Build v1.0.4
        body: "Automatic build from GitHub Actions. Enterprise v1.0.4 - Full Windows 7 & 8 (.NET 4.8 Architecture) & Universal ActiveX Automation."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EVedhika-UBD-Full-Bundle-Setup
        path: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
