name: Build CSharp Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln

    - name: Download Prerequisites (VC++ Redist & .NET 4.8) for Win7/8 Compatibility
      run: |
        if (!(Test-Path -Path "csharp_solution/EVedhikaUBDDeploymentTool/installers")) { New-Item -ItemType Directory -Path "csharp_solution/EVedhikaUBDDeploymentTool/installers" -Force }
        $ProgressPreference = 'SilentlyContinue'
        
        # Download VC++ Redistributable with retries
        try {
            curl.exe -f -L --retry 5 --retry-delay 2 --retry-all-errors -o "csharp_solution/EVedhikaUBDDeploymentTool/installers/vc_redist.x86.exe" "https://aka.ms/vs/17/release/vc_redist.x86.exe"
        } catch {
            Write-Host "Notice: VC++ Redist download skipped or deferred."
        }

        # Download .NET 4.8 Installer (Web Bootstrapper / Redistributable) with retries
        try {
            curl.exe -f -L --retry 5 --retry-delay 2 --retry-all-errors -o "csharp_solution/EVedhikaUBDDeploymentTool/installers/ndp48-x86-x64-allos-enu.exe" "https://go.microsoft.com/fwlink/?LinkId=2088630"
        } catch {
            Write-Host "Notice: .NET 4.8 installer download skipped or deferred."
        }

    - name: Build and Publish Executable
      run: |
        dotnet publish csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.csproj -c Release -o csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Compile Full Bundled Installer with Inno Setup (Includes all Payload files)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool_Setup.iss

    - name: Create Release Link (Fixed URL)
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        files: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
        name: Latest Stable Build v1.0.9 (Guardian Build - Resource Build 2026.11.09.R1)
        body: "Automatic build from GitHub Actions. Enterprise v1.0.9 Guardian Build (Resource Build 2026.11.09.R1) - Full Windows 7, 8, 10 & 11 (.NET 4.8 Architecture), 24x7 Silent Background Guardian, USB DSC Token Auto-Detector, Live OTA Update Support, Dual-Channel Independent Telemetry, Offline Queue & Auto-Retry, and Instant Telegram Reporting."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EVedhika-UBD-Full-Bundle-Setup
        path: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
