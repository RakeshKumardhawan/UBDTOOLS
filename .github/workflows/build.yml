name: Build CSharp Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln

    - name: Download Prerequisites (VC++ Redist & .NET 4.8) for Win7/8 Compatibility
      continue-on-error: true
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'
        $ProgressPreference = 'SilentlyContinue'
        $installDir = "csharp_solution/EVedhikaUBDDeploymentTool/installers"
        if (!(Test-Path -Path $installDir)) {
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
        }
        Set-Content -Path "$installDir/readme.txt" -Value "E-Vedhika Embedded Prerequisites Cache" -Force

        # VC++ Redistributable (13 MB)
        try {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" -OutFile "$installDir/vc_redist.x86.exe" -TimeoutSec 45 -UseBasicParsing
            Write-Host "VC++ Redistributable cached successfully."
        } catch {
            Write-Host "Notice: VC++ Redistributable download deferred ($($_.Exception.Message))"
        }

        # .NET 4.8 Web Bootstrapper (1.4 MB)
        try {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=2088631" -OutFile "$installDir/ndp48-x86-x64-allos-enu.exe" -TimeoutSec 45 -UseBasicParsing
            Write-Host ".NET 4.8 Bootstrapper cached successfully."
        } catch {
            Write-Host "Notice: .NET 4.8 Bootstrapper download deferred ($($_.Exception.Message))"
        }

        $global:LASTEXITCODE = 0
        exit 0

    - name: Build and Publish Executable
      run: |
        dotnet publish csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.csproj -c Release -o csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Generate Authenticode Certificate, Sign Binaries & Compile Signed Inno Setup Installer (Fixes Error 4551 & Smart App Control)
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'
        # 1. Locate Windows SDK signtool.exe
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
        if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "Located signtool.exe at: $signtool"

        # 2. Generate Authenticode Code-Signing Certificate
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=E-Vedhika Development Community, O=E-Vedhika Government Solutions, C=IN" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
        $pfxPass = ConvertTo-SecureString -String "EVedhika2026!" -Force -AsPlainText
        $pfxPath = "$PWD\EVedhika_CodeSign.pfx"
        $cerPath = "csharp_solution\EVedhikaUBDDeploymentTool\bin\Release\net48\EVedhika_TrustedRoot.cer"
        Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPass | Out-Null
        Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

        # 3. Compile Inno Setup Installer
        $outputDir = "csharp_solution\EVedhikaUBDDeploymentTool\Output"
        if (-not (Test-Path $outputDir)) {
            New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        }

        # Sign the inner application executable first
        if ($signtool -and (Test-Path $pfxPath)) {
            Write-Host "Signing main application executable..."
            & $signtool sign /f "$pfxPath" /p "EVedhika2026!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "csharp_solution\EVedhikaUBDDeploymentTool\bin\Release\net48\EVedhikaUBDDeploymentTool.exe"
        }

        # Compile Setup with Inno Setup compiler (ISCC)
        Write-Host "Compiling Inno Setup package..."
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "csharp_solution\EVedhikaUBDDeploymentTool\EVedhikaUBDDeploymentTool_Setup.iss"

        # Sign all generated setup executables in Output directory
        if ($signtool -and (Test-Path $pfxPath) -and (Test-Path $outputDir)) {
            Write-Host "Signing generated installer executables..."
            Get-ChildItem -Path "$outputDir\*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "Signing installer: $($_.FullName)"
                & $signtool sign /f "$pfxPath" /p "EVedhika2026!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $_.FullName
            }
        }

    - name: Create Release Link (Fixed URL)
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        files: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
          public/downloads/Unblock_EVedhika_Antivirus_Exclusion.bat
        name: Latest Stable Build v1.0.9 (Guardian Build - Resource Build 2026.11.12.R4)
        body: "Automatic build from GitHub Actions. Enterprise v1.0.9 Guardian Build (Resource Build 2026.11.12.R4) - Authenticode SHA-256 Signed Installer (Fixes Error 4551 & Windows 11 Smart App Control), Full Windows 7, 8, 10 & 11 (.NET 4.8 Architecture), 24x7 Silent Background Guardian, USB DSC Token Auto-Detector, Live OTA Update Notifications, and 100% Real-Time Website Report Sync to https://www.e-vedhika.in/admin/ubd_monitoring."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EVedhika-UBD-Full-Bundle-Setup
        path: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
          public/downloads/Unblock_EVedhika_Antivirus_Exclusion.bat
