name: Build CSharp Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln

    - name: Download Prerequisites (VC++ Redist & .NET 4.8) for Win7/8 Compatibility
      continue-on-error: true
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'
        $ProgressPreference = 'SilentlyContinue'
        $installDir = "csharp_solution/EVedhikaUBDDeploymentTool/installers"
        if (!(Test-Path -Path $installDir)) {
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
        }
        Set-Content -Path "$installDir/readme.txt" -Value "E-Vedhika Embedded Prerequisites Cache" -Force

        # VC++ Redistributable (13 MB)
        try {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" -OutFile "$installDir/vc_redist.x86.exe" -TimeoutSec 45 -UseBasicParsing
            Write-Host "VC++ Redistributable cached successfully."
        } catch {
            Write-Host "Notice: VC++ Redistributable download deferred ($($_.Exception.Message))"
        }

        # .NET 4.8 Web Bootstrapper (1.4 MB)
        try {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=2088631" -OutFile "$installDir/ndp48-x86-x64-allos-enu.exe" -TimeoutSec 45 -UseBasicParsing
            Write-Host ".NET 4.8 Bootstrapper cached successfully."
        } catch {
            Write-Host "Notice: .NET 4.8 Bootstrapper download deferred ($($_.Exception.Message))"
        }

        $global:LASTEXITCODE = 0
        exit 0

    - name: Build and Publish Executable
      run: |
        dotnet publish csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.csproj -c Release -o csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48 /p:TreatWarningsAsErrors=false /p:WarningLevel=0 /clp:ErrorsOnly

    - name: Install Inno Setup 6.2.2 (Universal Windows Vista / 7 SP0 / 7 SP1 / 8 / 10 / 11 Support)
      run: choco install innosetup --version=6.2.2 --allow-downgrade --force --no-progress -y

    - name: Sign Binaries & Compile Signed Inno Setup Installer (Supports Trusted CA Certificate via GitHub Secrets)
      shell: powershell
      env:
        SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      run: |
        $ErrorActionPreference = 'Continue'
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
        if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "Located signtool.exe at: $signtool"

        $pfxPath = "$PWD\EVedhika_CodeSign.pfx"
        $pfxPasswordPlain = "EVedhika2026!"
        $cerPath = "csharp_solution\EVedhikaUBDDeploymentTool\bin\Release\net48\EVedhika_TrustedRoot.cer"

        if ($env:SIGNING_PFX_BASE64 -and $env:SIGNING_PFX_PASSWORD) {
            Write-Host "Using Official Trusted CA Code Signing Certificate from GitHub Secrets..."
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64.Trim()))
            $pfxPasswordPlain = $env:SIGNING_PFX_PASSWORD
        } else {
            Write-Host "Notice: SIGNING_PFX_BASE64 secret not set - using build-time fallback certificate. Add a Trusted CA PFX secret for full Smart App Control reputation."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=E-Vedhika Development Community, O=E-Vedhika Government Solutions, C=IN" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
            $pfxPass = ConvertTo-SecureString -String $pfxPasswordPlain -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPass | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
        }

        $outputDir = "csharp_solution\EVedhikaUBDDeploymentTool\Output"
        if (-not (Test-Path $outputDir)) {
            New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        }

        if ($signtool -and (Test-Path $pfxPath)) {
            Write-Host "Signing main application executable..."
            & $signtool sign /f "$pfxPath" /p "$pfxPasswordPlain" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "csharp_solution\EVedhikaUBDDeploymentTool\bin\Release\net48\EVedhikaUBDDeploymentTool.exe"
        }

        Write-Host "Compiling Inno Setup package..."
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "csharp_solution\EVedhikaUBDDeploymentTool\EVedhikaUBDDeploymentTool_Setup.iss"

        if ($signtool -and (Test-Path $pfxPath) -and (Test-Path $outputDir)) {
            Write-Host "Signing generated installer executables..."
            Get-ChildItem -Path "$outputDir\*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                $targetExe = $_.FullName
                Write-Host "Signing installer: $targetExe"
                & $signtool sign /f "$pfxPath" /p "$pfxPasswordPlain" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$targetExe"
            }
        }

    - name: Create Release Link (Fixed URL)
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        files: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
          public/downloads/Unblock_EVedhika_Antivirus_Exclusion.bat
        name: Latest Stable Build v1.1.0 (Guardian Build - Resource Build 2026.11.20.R13)
        body: "Automatic build from GitHub Actions. Enterprise v1.1.0 Guardian Build (Resource Build 2026.11.20.R13) - SignatureDemoLib v2.0.3.0 Universal CNG+CSP Engine (Native Win32 CryptSignMessage fixes 'Unable to read token: Invalid algorithm specified.', 'Both signing methods failed.', 'Unable to Sign: [object Error]', and 'Verification failed, Data might be Tampered'; strict DigitalSignature/NonRepudiation cert filter; Fusion-synced COM & IE ActiveX Kill-Bit auto-clear), Auto & Manual Old/Other-User DSC Cert Cleaner, Strict State-Isolated UBD sites.xml (TS-only IE5 / AP-only IE7), Single Particular GitHub Admin Live Hub (https://rakeshkumardhawan.github.io/UBDTOOLS/admin/), and Automatic OTA Upgrade."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EVedhika-UBD-Full-Bundle-Setup
        path: |
          csharp_solution/EVedhikaUBDDeploymentTool/Output/*.exe
          csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/net48/*.exe
          public/downloads/Unblock_EVedhika_Antivirus_Exclusion.bat
