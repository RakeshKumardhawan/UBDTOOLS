name: Build CSharp Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln

    - name: Build Solution (Release)
      run: |
        msbuild csharp_solution/EVedhikaUBDDeploymentTool/EVedhikaUBDDeploymentTool.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Create Release Link (Fixed URL)
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        files: csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/*.exe
        name: Latest Stable Build
        body: "Automatic build from GitHub Actions. This link always points to the latest EXE for OTA updates."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EVedhika-UBD-Tool-Exe
        path: csharp_solution/EVedhikaUBDDeploymentTool/bin/Release/*.exe
